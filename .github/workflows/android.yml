name: Android CI
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unpack project and build APK
        run: |
          if [ ! -f FloatingLiveScore.zip ]; then
            echo "ERROR: FloatingLiveScore.zip not found in the repository"
            ls -la
            exit 1
          fi
          mkdir -p /tmp/proj
          unzip -q FloatingLiveScore.zip -d /tmp/proj
          cd /tmp/proj/FloatingLiveScore
          ls -la
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/LiveScoreFloat.apk"

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LiveScoreFloat-APK
          path: out/LiveScoreFloat.apk
          if-no-files-found: error

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Live Score Float build ${{ github.run_number }}
          files: out/LiveScoreFloat.apk
