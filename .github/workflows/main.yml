name: Android CI
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          S=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$S" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi
          cd "$(dirname "$S")"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Show the APK that was built
        run: find . -name "*.apk" -print

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LiveScoreFloat-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Live Score Float build ${{ github.run_number }}
          files: "**/build/outputs/apk/debug/*.apk"
